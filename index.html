<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Счётчик нажатий</title>
    <style>
      .buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #3224;
        height: 5rem;
      }

      .button {
        width: 80px;
        height: 45px;
        margin: 6px;
        cursor: pointer;
      }

      .counter {
        display: flex;
        justify-content: center;
        margin-top: 1rem;
        font-size: 25px;
      }
    </style>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Счётчик нажатий</h1>

      <div class="buttons">
        <button class="button" type="button">Нажми меня</button>
        <button class="button" type="button">Нажми меня</button>
        <button class="button" type="button">Нажми меня</button>
        <button class="button" type="button">Нажми меня</button>
        <button class="button" type="button">Нажми меня</button>
      </div>

      <div class="counter">0</div>
    </main>
  </body>
</html>
